name: Temporary Windows QR validation

on:
  push:
    branches: [fix/windows-qr-font]

permissions:
  contents: read

jobs:
  windows-qr:
    name: Windows QR renderer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows executable
        run: cargo build --locked

      - name: Test QR glyphs, modules, and quiet zone
        run: cargo test --locked --bin miniserve terminal_qr::tests -- --nocapture
